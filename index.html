<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 AI 工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, rgba(167,121,255,0.18), transparent 60%),
                radial-gradient(1000px 700px at 10% 110%, rgba(85,228,237,0.12), transparent 60%),
                linear-gradient(160deg, #0a0e1a 0%, #04060c 100%);
    color: #d8e1ff;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 460px; width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 44px 32px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo {
    width: 72px; height: 72px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, rgba(167,121,255,0.25), rgba(85,228,237,0.25));
    border: 1px solid rgba(167,121,255,0.4);
    box-shadow: 0 0 30px rgba(167,121,255,0.25);
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #fff; }
  p.desc { font-size: 14px; color: rgba(170,184,220,0.75); margin-bottom: 28px; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; color: #55e4ed; font-size: 14px; margin-bottom: 20px; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(85,228,237,0.2);
    border-top-color: #55e4ed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.btn {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 28px;
    border-radius: 999px;
    background: linear-gradient(135deg, #a779ff, #55e4ed);
    color: #0a0e1a; font-weight: 700; font-size: 14px;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(167,121,255,0.35);
  }
  .tip { margin-top: 24px; font-size: 12px; color: rgba(170,184,220,0.5); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🤖</div>
  <h1>我的 AI 工作台</h1>
  <p class="desc">正在帮你进入工作台，请稍等…</p>
  <div class="loading"><div class="spinner"></div><span>正在连接小马…</span></div>
  <a class="btn" id="manual-link" href="#" style="display:none">打不开就点这里直接进入</a>
  <p class="tip">这个网址是固定的，收藏它就行<br>如果打不开，说明老师的电脑还没开机</p>
</div>
<script>
// 固定入口页：读取最新隧道地址并自动跳转（双源容错：主源挂了自动换备源）
// url.txt 由老师电脑开机后自动更新（start_tunnel.sh）
// 主源 = Cloudflare Pages（部署快，2026-08-30 加），备源 = 本托管自身 url.txt
var SOURCES = [
  'https://workbench-redirect.pages.dev/url.txt?v=' + Date.now(),
  'url.txt?v=' + Date.now()
];
function tryUrl(i) {
  if (i >= SOURCES.length) {
    document.querySelector('.loading span').textContent = '连接不上，请稍后刷新重试';
    return;
  }
  fetch(SOURCES[i], { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var u = (t.match(/https:\/\/[^\s]+/) || [''])[0];
      if (u) {
        var link = document.getElementById('manual-link');
        link.href = u;
        link.style.display = 'inline-block';
        link.textContent = '进入我的 AI 工作台';
        location.replace(u);
      } else {
        tryUrl(i + 1);
      }
    })
    .catch(function () { tryUrl(i + 1); });
}
tryUrl(0);
</script>
</body>
</html>
